<h2 class="sr-only">A trajectory simulation video gallery backed by YouTube: click a small thumbnail to load it into the large player above.</h2>

<div style="width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border);">
  <iframe id="mainPlayer" src="https://www.youtube.com/embed/u9ginFlW0I0" style="width: 100%; height: 100%; border: 0;" allow="autoplay" allowfullscreen></iframe>
</div>
<p id="mainLabel" style="font-size: 14px; color: var(--text-secondary); margin: 8px 0 1.25rem;">Now playing: trajectory 1</p>

<div id="thumbGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px;"></div>

<script>
const videos = [
  { label: "trajectory 1", id: "u9ginFlW0I0" },
  { label: "trajectory 2", id: "r3ZXzrLoNVw" },
  { label: "trajectory 3", id: "jsPmE_2OiN8" },
  { label: "trajectory 4", id: "QCakF_DDRXk" }
];

const grid = document.getElementById('thumbGrid');
const main = document.getElementById('mainPlayer');
const label = document.getElementById('mainLabel');

videos.forEach((v) => {
  const cell = document.createElement('div');
  cell.style.cursor = 'pointer';
  cell.innerHTML = `
    <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" style="width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); border: 0.5px solid var(--border); object-fit: cover; display: block;" />
    <p style="font-size: 13px; margin: 6px 0 0; text-align: center; color: var(--text-secondary);">${v.label}</p>
  `;
  cell.addEventListener('click', () => {
    main.src = `https://www.youtube.com/embed/${v.id}?autoplay=1`;
    label.textContent = 'Now playing: ' + v.label;
  });
  grid.appendChild(cell);
});
</script>
