<h2 style="text-align: center; font-size: 25px; font-weight: 500; margin: 0 0 1rem;">Trajectory simulations</h2>

<div style="display: flex; gap: 12px; align-items: flex-start;">
  <div style="flex: 3; min-width: 0;">
    <div style="width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border);">
      <iframe id="mainPlayer" src="https://youtu.be/RZv-3QLOQ8U" style="width: 100%; height: 100%; border: 0;" allow="autoplay" allowfullscreen></iframe>
    </div>
    <p id="mainLabel" style="font-size: 14px; color: var(--text-secondary); margin: 8px 0 0;">Now playing: trajectory 1</p>
  </div>

  <div id="thumbGrid" style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 90px;"></div>
</div>

<script>
const videos = [
  { label: "trajectory 1", id: "RZv-3QLOQ8U" },
  { label: "trajectory 2", id: "r3ZXzrLoNVw" },
  { label: "trajectory 3", id: "jsPmE_2OiN8" },
  { label: "trajectory 4", id: "QCakF_DDRXk" }
];

const grid = document.getElementById('thumbGrid');
const main = document.getElementById('mainPlayer');
const label = document.getElementById('mainLabel');

videos.forEach((v) => {
  const cell = document.createElement('div');
  cell.style.cursor = 'pointer';
  cell.innerHTML = `
    <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" style="width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); border: 0.5px solid var(--border); object-fit: cover; display: block;" />
    <p style="font-size: 12px; margin: 4px 0 0; text-align: center; color: var(--text-secondary);">${v.label}</p>
  `;
  cell.addEventListener('click', () => {
    main.src = `https://www.youtube.com/embed/${v.id}?autoplay=1`;
    label.textContent = 'Now playing: ' + v.label;
  });
  grid.appendChild(cell);
});
</script>
